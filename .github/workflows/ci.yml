name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
      - staging
      - release
  push:
    branches:
      - master
      - dev
      - staging
      - release

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ssh_monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ssh_monitor/requirements/local.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: ssh_monitor.settings.local
        run: pytest --cov=apps --cov-report=term-missing
