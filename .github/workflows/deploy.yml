name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment target environment"
        required: true
        type: choice
        options:
          - staging
          - release
      target_ref:
        description: "Git ref to deploy (defaults to triggering SHA)"
        required: false
        default: ""
  push:
    branches:
      - staging
      - release

concurrency:
  group: deploy-${{ github.ref_name || github.event.inputs.target_env }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: |
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ secrets.STAGING_VPS_DEPLOY_PATH }}"
            if [ -z "${DEPLOY_ROOT}" ]; then
              echo "STAGING_VPS_DEPLOY_PATH secret is required."
              exit 1
            fi

            cd "${DEPLOY_ROOT}"
            if [ ! -f "./scripts/deploy.sh" ] && [ -f "./ssh_monitor/scripts/deploy.sh" ]; then
              cd ssh_monitor
            fi

            TARGET_REF="${{ github.sha }}"
            if [ -n "${{ github.event.inputs.target_ref }}" ]; then
              TARGET_REF="${{ github.event.inputs.target_ref }}"
            fi

            export DEPLOY_ROOT="$(pwd)"
            export DEPLOY_REF="${TARGET_REF}"
            export HEALTHCHECK_URL="${{ secrets.STAGING_HEALTHCHECK_URL }}"

            ./scripts/deploy.sh

  deploy-release:
    if: |
      (github.event_name == 'push' && github.ref_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    steps:
      - name: Deploy release over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RELEASE_VPS_HOST }}
          username: ${{ secrets.RELEASE_VPS_USER }}
          key: ${{ secrets.RELEASE_VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.RELEASE_VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ secrets.RELEASE_VPS_DEPLOY_PATH }}"
            if [ -z "${DEPLOY_ROOT}" ]; then
              echo "RELEASE_VPS_DEPLOY_PATH secret is required."
              exit 1
            fi

            cd "${DEPLOY_ROOT}"
            if [ ! -f "./scripts/deploy.sh" ] && [ -f "./ssh_monitor/scripts/deploy.sh" ]; then
              cd ssh_monitor
            fi

            TARGET_REF="${{ github.sha }}"
            if [ -n "${{ github.event.inputs.target_ref }}" ]; then
              TARGET_REF="${{ github.event.inputs.target_ref }}"
            fi

            export DEPLOY_ROOT="$(pwd)"
            export DEPLOY_REF="${TARGET_REF}"
            export HEALTHCHECK_URL="${{ secrets.RELEASE_HEALTHCHECK_URL }}"

            ./scripts/deploy.sh
